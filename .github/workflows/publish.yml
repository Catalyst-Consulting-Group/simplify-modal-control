name: Publish

on: workflow_dispatch

# npm trusted publishing: authenticates with GitHub OIDC, no NPM token secret
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      # trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Run Test
        run: npm run test:ci
      - name: Run Build
        run: npm run build
      - name: Publish
        working-directory: ./dist
        run: npm publish
