name: Build Test

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Run Test
        run: npm run test:ci
      - name: Run Build
        run: npm run build
